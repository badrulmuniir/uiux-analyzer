<!-- node analyze.mjs sample\index.html -->
 
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="stylesheet" href="wp-content/themes/sample-theme/style.css">
</head>
<body class="home page-template">
  <div id="page" class="site">
    <header class="site-header">
      <div class="site-branding">
        <a href="index.html"><img src="wp-content/uploads/hero.svg" class="site-logo" width="120" height="45" alt="Green Valley Bakery"></a>
        <h3 class="site-title">Green Valley Bakery</h3>
      </div>
      <button class="menu-toggle" id="menuToggle"><span class="bar"></span><span class="bar"></span><span class="bar"></span></button>
      <nav class="main-nav" id="mainNav">
        <a href="index.html">Home</a>
        <a href="contact/index.html">Contact</a>
        <a href="#menu"></a>
      </nav>
    </header>

    <div class="content-area">
      <div class="hero">
        <img src="wp-content/uploads/hero.svg" class="hero-image" width="800" height="300" alt="">
        <h4 class="hero-title">Fresh bread, baked every morning</h4>
        <p class="hero-text">Order online and pick up at the shop.</p>
      </div>

      <h2 id="menu" class="section-title">Our menu</h2>
      <p class="muted">Prices include tax. Updated weekly.</p>

      <h5 class="section-title">Newsletter</h5>
      <form class="newsletter" action="#" method="post">
        <input type="email" name="email" placeholder="Your email">
        <input type="text" name="name" placeholder="Your name">
        <button type="submit" class="btn-subscribe"><i class="icon-arrow"></i></button>
      </form>
    </div>

    <footer class="site-footer">
      <p class="muted-footer">&copy; 2026 Green Valley Bakery</p>
    </footer>
  </div>
  <script src="wp-content/themes/sample-theme/js/main.js"></script>
</body>
</html>
