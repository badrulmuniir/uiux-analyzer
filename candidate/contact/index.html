<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Green Valley Bakery</title>
  <link rel="stylesheet" href="../wp-content/themes/sample-theme/style.css">
</head>
<body class="page contact">
  <header class="site-header">
    <div class="site-branding"><h1 class="site-title">Green Valley Bakery</h1></div>
    <nav class="main-nav"><a href="../index.html">Home</a><a href="index.html">Contact</a></nav>
  </header>
  <main class="content-area">
    <h1>Contact us</h1>
    <form action="#" method="post" class="contact-form">
      <input type="text" name="your-name" placeholder="Name">
      <input type="email" name="your-email" placeholder="Email">
      <textarea name="your-message" rows="5" placeholder="Message"></textarea>
      <select name="topic"><option>Orders</option><option>Catering</option></select>
      <button type="submit" class="btn-subscribe">Send</button>
    </form>
  </main>
  <footer class="site-footer"><p class="muted-footer">&copy; 2026 Green Valley Bakery</p></footer>
  <script src="../wp-content/themes/sample-theme/js/main.js"></script>
</body>
</html>
